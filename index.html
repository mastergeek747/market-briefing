  const WEEKDAYS = ["일", "월", "화", "수", "목", "금", "토"];

  function fmtNum(v, decimals) {
    return v.toLocaleString("ko-KR", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  }

  function fmtValue(metric, v) {
    if (v === undefined || v === null) return "—";
    let s = fmtNum(Math.abs(v), metric.decimals);
    if (metric.signed) s = (v > 0 ? "+" : v < 0 ? "-" : "") + s;
    if (metric.prefix) return metric.unit + s;
    return s + metric.unit;
  }

  function direction(cur, prev) {
    if (cur === undefined || cur === null || prev === undefined || prev === null) return "flat";
    if (cur > prev) return "up";
    if (cur < prev) return "down";
    return "flat";
  }

  function arrow(dir) {
    return dir === "up" ? "▲" : dir === "down" ? "▼" : "•";
  }

  function deltaText(metric, cur, prev) {
    if (cur === undefined || cur === null || prev === undefined || prev === null) return null;
    const diff = cur - prev;
    if (diff === 0) return "0";
    const sign = diff > 0 ? "+" : "-";
    return sign + fmtNum(Math.abs(diff), metric.decimals) + metric.unit;
  }

  function renderSnapshot() {
    const entry = DATA[DATA.length - 1];
    const d = new Date(entry.date + "T00:00:00");
    const weekday = WEEKDAYS[d.getDay()];

    let html = `
      <div class="snapshot-head">
        <span class="snapshot-date">${entry.date}</span>
        <span class="snapshot-weekday">${weekday}요일 마감</span>
      </div>
      <p class="headline">${entry.headline || ""}</p>
      <div class="card-grid">`;

    for (const m of METRICS) {
      const cur = entry.values[m.key];
      const prev = entry.prev ? entry.prev[m.key] : undefined;
      const dir = direction(cur, prev);
      const dt = deltaText(m, cur, prev);
      html += `
        <div class="stat-card">
          <div class="stat-label">${m.label}</div>
          <div class="stat-value-row">
            <span class="stat-value">${fmtValue(m, cur)}</span>
            ${dt !== null ? `<span class="stat-delta ${dir}">${arrow(dir)} ${dt}</span>` : ""}
          </div>
          ${prev !== undefined ? `<div class="stat-prev">전일 ${fmtValue(m, prev)}</div>` : ""}
        </div>`;
    }
    html += `</div>`;

    if (entry.notes && entry.notes.length) {
      html += `<div class="notes-row">` + entry.notes.map(n => `<span class="note-tag">${n}</span>`).join("") + `</div>`;
    } else {
      html += `<div style="margin-bottom:44px"></div>`;
    }

    document.getElementById("snapshot").innerHTML = html;
  }

  function renderTable() {
    let thead = "<thead><tr><th>날짜</th>";
    for (const m of METRICS) thead += `<th>${m.short}</th>`;
    thead += "<th>특이사항</th></tr></thead>";

    let tbody = "<tbody>";
    for (let i = DATA.length - 1; i >= 0; i--) {
      const entry = DATA[i];
      tbody += `<tr><td class="cell-date">${entry.date}</td>`;
      for (const m of METRICS) {
        const cur = entry.values[m.key];
        const prev = entry.prev ? entry.prev[m.key] : undefined;
        const dir = direction(cur, prev);
        tbody += `<td>${fmtValue(m, cur)}${prev !== undefined ? `<span class="chip ${dir}">${arrow(dir)}</span>` : ""}</td>`;
      }
      tbody += `<td class="cell-notes">${(entry.notes || []).join(" · ")}</td></tr>`;
    }
    tbody += "</tbody>";

    document.getElementById("history-table").innerHTML = thead + tbody;
  }

  renderSnapshot();
  renderTable();
